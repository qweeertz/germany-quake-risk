[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quakerisk"
version = "0.1.0"
description = "Scenario earthquake damage and risk for Germany from GEM exposure disaggregated to a 1 km grid"
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "numpy==2.2.6",
    "pandas==2.2.3",
    "scipy",
    "numba==0.61.2",
    "pyarrow",
    "geopandas~=1.1.3",
    "shapely",
    "pyproj~=3.7.2",
    "h3>=4,<5",
    "fastapi",
    "uvicorn",
    # needed to import the OpenQuake hazard library
    "h5py", "decorator~=5.1.1", "toml", "requests", "psutil", "docutils<0.20", "pyzmq~=26.2.0",
    "django>=4.2,<5", "django-cors-headers", "alpha_shapes", "fiona", "pillow",
]

[project.optional-dependencies]
dev = ["pytest", "httpx2", "ruff"]
validation = ["matplotlib"]

[project.scripts]
quakerisk = "quakerisk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 125
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "B", "I"]
ignore = ["B905"]

[tool.pytest.ini_options]
testpaths = ["tests"]
